name: CI

on:
  push:
  pull_request:

# The runner image is pinned rather than "latest": ubuntu-latest is migrating
# to Ubuntu 26 in October 2026, and an implicit image change should never be
# able to break the build. (Note: runs-on cannot read the `env` context, so
# this has to be spelled out per job.)
jobs:
  rouge-compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake
          # qemu-user lets the RISC-V target actually RUN (not just compile):
          # the freestanding riscv64 binary is executed under qemu-riscv64 and
          # its result is checked. Without it that test reports SKIP.
          sudo apt-get install -y qemu-user

      - name: Configure (rouge-compiler)
        run: cmake -S software/rouge-compiler -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (rouge-compiler)
        run: cmake --build build

      - name: Test (rouge-compiler)
        run: ctest --test-dir build --output-on-failure

  rouge-cuda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake

      - name: Configure (rouge-cuda)
        run: cmake -S software/rouge-cuda -B build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (rouge-cuda)
        run: cmake --build build-cuda

      - name: Test (rouge-cuda)
        run: ctest --test-dir build-cuda --output-on-failure
